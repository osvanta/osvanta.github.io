<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osvanta</title>
<meta name="description" content="Osvanta builds Bus Log Analyzer, a Windows tool for loading, decoding and plotting automotive bus measurement files.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0D1B2A; color: #E8EEF5;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding: 24px 16px;
  }
  main { max-width: 560px; text-align: center; }
  h1 { font-size: 2.5rem; letter-spacing: 0.04em; margin: 0 0 8px; font-weight: 600; }
  h1 span { color: #3FB6FF; }
  p { color: #9FB1C4; line-height: 1.6; margin: 0 0 16px; }
  .soon { color: #7FA6C8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.18em; }
  nav { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    color: #E8EEF5; text-decoration: none; padding: 10px 18px; border-radius: 6px;
    border: 1px solid #5E7A96;
  }
  a.primary { background: #1F7AE0; border-color: #1F7AE0; }
  a:hover, a:focus-visible { border-color: #3FB6FF; outline: none; }
</style>
</head>
<body>
<main>
  <p class="soon">Website coming soon</p>
  <h1>Osvan<span>ta</span></h1>
  <p>Bus Log Analyzer is a Windows desktop tool that loads automotive bus measurement files,
     decodes signals with DBC or ARXML databases, and plots them interactively.</p>
  <nav>
    <a class="primary" href="https://github.com/osvanta/bus-log-analyzer/releases/latest">Download</a>
    <a href="/bus-log-analyzer/">User guide</a>
    <a href="https://github.com/osvanta/bus-log-analyzer">Source on GitHub</a>
  </nav>
</main>
</body>
</html>
